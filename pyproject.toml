[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "madgraph-script-generator"
version = "0.1.0"
description = "Tool to generate and manage MadGraph5 script files"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["tqdm>=4.67.3", "typer>=0.23.2", "typing-extensions>=4.15.0"]

[tool.ruff]
exclude = [".venv", "scripts/diquarkVquark2023_UFO"]

[tool.ruff.lint]
ignore = [
    # Don't reorder/organize imports
    "I001",
]

[tool.ruff.lint.per-file-ignores]
"{src/ultraheavy_diquark,scripts}/**" = ["TRY002"]

[tool.hatch.build.targets.wheel]
packages = ["src/madgraph_script_generator"]

[dependency-groups]
dev = ["pytest>=8.4.2"]
